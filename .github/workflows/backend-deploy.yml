# .github/workflows/backend-deploy.yml
# Automated CI/CD pipeline for the Render-hosted backend.
#
# Trigger: Push to master (backend/ directory changes only)
# Steps:  Health check → Trigger Render deploy → Verify health
#
# Required GitHub Secrets (set in repo Settings → Secrets):
#   RENDER_API_KEY      — From Render dashboard → Account Settings → API Keys
#   RENDER_SERVICE_ID   — From Render dashboard → your service → Settings → Service ID
#                         (looks like: srv-xxxxxxxxxxxxxxxxxxxxx)
#   RENDER_DEPLOY_HOOK  — (Alternative) Deploy hook URL from Render dashboard
#                         Service → Settings → Deploy Hook → copy the URL

name: 🖥️ Backend → Render

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  # ── Step 1: Validate ───────────────────────────────────────────────────
  validate:
    name: 🔍 Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/index.js

      - name: Verify all imports resolve
        run: |
          echo "Checking critical imports..."
          node -e "
            require('./src/config/db');
            require('./src/config/cache');
            require('./src/controller/product.controller');
            require('./src/routes/product.routes');
            console.log('✅ All imports resolved successfully');
          "

  # ── Step 2: Deploy via Render Deploy Hook ──────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy
        id: deploy
        run: |
          echo "🚀 Triggering Render deployment..."

          # Method 1: Deploy Hook (simplest — just a POST to a URL)
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
            echo "Deploy hook response: $RESPONSE"
            if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
              echo "✅ Deploy hook triggered successfully"
            else
              echo "❌ Deploy hook failed with status: $RESPONSE"
              exit 1
            fi

          # Method 2: Render API (more control — requires API key + service ID)
          elif [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "API response: $HTTP_CODE"
            echo "deploy_body=$BODY" >> $GITHUB_OUTPUT
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Render deploy triggered via API"
            else
              echo "❌ Render API deploy failed: $BODY"
              exit 1
            fi

          else
            echo "❌ No RENDER_DEPLOY_HOOK or RENDER_API_KEY configured"
            echo "Please set one of these secrets in GitHub repo settings"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 60s for Render to build and deploy..."
          sleep 60

      - name: Verify health
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.RENDER_SERVICE_URL || 'https://yadhra-closet-api.onrender.com' }}/api/health" \
              --max-time 10) || true

            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi

            echo "⏳ Not ready yet (HTTP $RESPONSE), retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "⚠️ Health check didn't pass after $MAX_RETRIES attempts"
          echo "The deployment may still be building. Check Render dashboard."
          # Don't fail the workflow — Render free tier can take 2-3 min to spin up
          exit 0

      - name: Deployment Summary
        run: |
          echo "### 🖥️ Backend Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Render (Singapore region)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** /api/health" >> $GITHUB_STEP_SUMMARY

  # ── Step 3: PR Check (no deploy) ───────────────────────────────────────
  pr-check:
    name: ✅ PR Validation
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: PR Summary
        run: |
          echo "### ✅ Backend PR Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All imports resolve and syntax is valid." >> $GITHUB_STEP_SUMMARY
          echo "Backend will deploy to Render when merged to master." >> $GITHUB_STEP_SUMMARY
